name: Spectrum core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host and ARM compilation tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile with warnings as errors
        run: cmake --build build --parallel
      - name: Run CMake tests
        run: ctest --test-dir build --output-on-failure
      - name: Cross-compile portable modules for Cortex-M0+
        run: |
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -c src/spectrum/spectrum_detect.c -o /tmp/d10s_spectrum_detect_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -c src/spectrum/spectrum_plan.c -o /tmp/d10s_spectrum_plan_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -c src/spectrum/spectrum_scanner.c -o /tmp/d10s_spectrum_scanner_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/app -Isrc/spectrum -Isrc/ui -Isrc/platform -Isrc/radio -c src/app/spectrum_app.c -o /tmp/d10s_spectrum_app_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/ui -c src/ui/spectrum_view.c -o /tmp/d10s_spectrum_view_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/ui -c src/ui/spectrum_key.c -o /tmp/d10s_spectrum_key_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/ui -Isrc/platform -c src/platform/mono128x64.c -o /tmp/d10s_mono128x64_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/platform -c src/platform/st7565.c -o /tmp/d10s_st7565_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/radio -c src/radio/bk4829_bus.c -o /tmp/d10s_bk4829_bus_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/radio -c src/radio/bk4829.c -o /tmp/d10s_bk4829_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/radio -c src/radio/bk4829_timing.c -o /tmp/d10s_bk4829_timing_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -c src/radio/bk4829_scanner_adapter.c -o /tmp/d10s_bk4829_scanner_adapter_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -c src/radio/bk4829_uvk1_v3_profile.c -o /tmp/d10s_bk4829_uvk1_v3_profile_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -c src/radio/bk4829_uvk1_v3_radio.c -o /tmp/d10s_bk4829_uvk1_v3_radio_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -Isrc/platform -Isrc/ui -c src/platform/py32f071_uvk1_v3.c -o /tmp/d10s_py32f071_uvk1_v3_arm.o
      - name: Link complete PY32F071 application and validate image layout
        run: |
          mkdir -p build/target
          TARGET_SOURCES="
            target/startup.c
            target/runtime.c
            target/main.c
            src/spectrum/spectrum_detect.c
            src/spectrum/spectrum_plan.c
            src/spectrum/spectrum_scanner.c
            src/ui/spectrum_view.c
            src/ui/spectrum_key.c
            src/app/spectrum_app.c
            src/platform/mono128x64.c
            src/platform/st7565.c
            src/platform/py32f071_uvk1_v3.c
            src/radio/bk4829_bus.c
            src/radio/bk4829.c
            src/radio/bk4829_timing.c
            src/radio/bk4829_scanner_adapter.c
            src/radio/bk4829_uvk1_v3_profile.c
            src/radio/bk4829_uvk1_v3_radio.c
          "
          OBJECTS=""
          for source in $TARGET_SOURCES; do
            object="build/target/$(echo "$source" | tr '/.' '__').o"
            arm-none-eabi-gcc -mcpu=cortex-m0plus -mthumb -std=c11 -Os \
              -ffreestanding -fno-builtin -fno-common -ffunction-sections -fdata-sections \
              -fstack-usage -fcallgraph-info=su,da -Wstack-usage=768 \
              -fno-unwind-tables -fno-asynchronous-unwind-tables \
              -Wall -Wextra -Werror \
              -Isrc/spectrum -Isrc/ui -Isrc/app -Isrc/platform -Isrc/radio \
              -c "$source" -o "$object"
            OBJECTS="$OBJECTS $object"
          done
          arm-none-eabi-gcc -mcpu=cortex-m0plus -mthumb -nostdlib \
            -Wl,-T,target/py32f071xB.ld \
            -Wl,--gc-sections -Wl,--build-id=none \
            -Wl,-Map=build/target/D10S_K1.map \
            $OBJECTS -lgcc -o build/target/D10S_K1.elf
          arm-none-eabi-size build/target/D10S_K1.elf
          python3 target/check_stack_usage.py build/target
          python3 target/check_callgraph_stack.py build/target --entry Reset_Handler --exception-reserve 40 --budget 1536 --link-map build/target/D10S_K1.map
          arm-none-eabi-objcopy -O binary build/target/D10S_K1.elf \
            build/target/D10S_K1.bin
          python3 target/validate_image.py build/target/D10S_K1.bin
      - name: Preserve stack-analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D10S-K1-stack-analysis-diagnostics
          path: |
            build/target/*.ci
            build/target/*.su
            build/target/D10S_K1.map
            build/target/D10S_K1.elf
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Makefile build and tests
        run: make test
      - name: Package firmware release candidate
        if: success()
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "target=PY32F071 Cortex-M0+"
            echo "status=RELEASE_CANDIDATE_HARDWARE_VALIDATION_REQUIRED"
            sha256sum build/target/D10S_K1.bin
            stat -c "image_bytes=%s" build/target/D10S_K1.bin
            arm-none-eabi-size build/target/D10S_K1.elf
          } > build/target/BUILD-METADATA.txt
      - name: Upload firmware release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: D10S-K1-firmware-release-candidate
          path: |
            build/target/D10S_K1.elf
            build/target/D10S_K1.map
            build/target/D10S_K1.bin
            build/target/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 14
