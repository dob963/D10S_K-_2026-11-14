name: Spectrum core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host and ARM compilation tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile with warnings as errors
        run: cmake --build build --parallel
      - name: Run CMake tests
        run: ctest --test-dir build --output-on-failure
      - name: Cross-compile portable modules for Cortex-M0+
        run: |
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -c src/spectrum/spectrum_detect.c -o /tmp/d10s_spectrum_detect_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -c src/spectrum/spectrum_plan.c -o /tmp/d10s_spectrum_plan_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -c src/spectrum/spectrum_scanner.c -o /tmp/d10s_spectrum_scanner_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/app -Isrc/spectrum -Isrc/ui -Isrc/platform -Isrc/radio -c src/app/spectrum_app.c -o /tmp/d10s_spectrum_app_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/ui -c src/ui/spectrum_view.c -o /tmp/d10s_spectrum_view_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/ui -Isrc/platform -c src/platform/mono128x64.c -o /tmp/d10s_mono128x64_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/platform -c src/platform/st7565.c -o /tmp/d10s_st7565_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/radio -c src/radio/bk4829_bus.c -o /tmp/d10s_bk4829_bus_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/radio -c src/radio/bk4829.c -o /tmp/d10s_bk4829_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/radio -c src/radio/bk4829_timing.c -o /tmp/d10s_bk4829_timing_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -c src/radio/bk4829_scanner_adapter.c -o /tmp/d10s_bk4829_scanner_adapter_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -c src/radio/bk4829_uvk1_v3_profile.c -o /tmp/d10s_bk4829_uvk1_v3_profile_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -c src/radio/bk4829_uvk1_v3_radio.c -o /tmp/d10s_bk4829_uvk1_v3_radio_arm.o
          clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -Isrc/radio -Isrc/platform -c src/platform/py32f071_uvk1_v3.c -o /tmp/d10s_py32f071_uvk1_v3_arm.o
      - name: Verify Makefile build and tests
        run: make clean && make test
