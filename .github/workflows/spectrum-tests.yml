name: Spectrum core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test and cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Run portable Spectrum tests
        run: make test
      - name: Cross-compile Spectrum core for Cortex-M0+
        run: clang --target=arm-none-eabi -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding -Wall -Wextra -Werror -pedantic -Isrc/spectrum -c src/spectrum/spectrum_detect.c -o /tmp/d10s_spectrum_arm.o
